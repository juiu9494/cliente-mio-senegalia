<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menù – IN&OUT Senigallia</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d0b09;
            --surface: #171412;
            --text: #f5f1e8;
            --muted: #b0a89d;
            --accent: #d4a373;
            --accent-strong: #e6b17e;
            --gold: #c9a962;
            --whatsapp: #25D366;
            --deliveroo: #00ccbc;
            --shadow: 0 12px 40px rgba(0,0,0,0.5);
            --radius: 20px;
            --transition: all 0.35s ease;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.7;
            overflow-x: hidden;
        }
        .menu-header {
            background: var(--surface);
            padding: 50px 0 30px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .menu-header h1 { font-size: 3.5rem; color: var(--gold); margin-bottom: 10px; }
        .menu-header p { color: var(--muted); font-size: 1.2rem; }
        .back-btn {
            display: inline-block;
            margin-top: 20px;
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1rem;
            transition: color 0.3s;
        }
        .back-btn:hover { color: var(--accent-strong); }
        .menu-image-container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
            text-align: center;
        }
        .menu-image-container img {
            width: 100%;
            height: auto;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid rgba(255,255,255,0.06);
        }
        .deliveroo-btn-container {
            text-align: center;
            margin: 30px 0 50px;
        }
        .btn-deliveroo {
            background: var(--deliveroo);
            color: white;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 18px 42px;
            border-radius: 50px;
            font-weight: 600;
            text-decoration: none;
            font-size: 1.2rem;
            transition: var(--transition);
            box-shadow: 0 10px 30px rgba(0, 204, 188, 0.3);
        }
        .btn-deliveroo:hover {
            background: #00b3a4;
            transform: translateY(-4px);
        }
        .whatsapp-float {
            position: fixed;
            bottom: 30px;
            left: 30px;
            width: 60px;
            height: 60px;
            background: var(--whatsapp);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.8rem;
            box-shadow: 0 6px 20px rgba(37,211,102,0.4);
            z-index: 99;
            text-decoration: none;
        }
        .whatsapp-float:hover { transform: scale(1.1); }
        @media (max-width: 768px) {
            .menu-header h1 { font-size: 2.5rem; }
            .menu-image-container { margin: 20px auto; }
            .btn-deliveroo { padding: 16px 30px; font-size: 1rem; }
        }
    </style>
</head>
<body>

<div class="menu-header">
    <div class="container" style="max-width: 1000px; margin: 0 auto;">
        <h1>Il Nostro Menù</h1>
        <p>Pizzeria Ristorante – Senigallia</p>
        <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Torna alla Home</a>
    </div>
</div>

<div class="menu-image-container">
    <img src="menu2026.jpeg" alt="Menù IN&OUT Senigallia 2026" onerror="this.onerror=null; this.src='https://placehold.co/1000x1400/1f1b17/c9a962?text=Menù+IN%26OUT+2026';">
</div>

<div class="deliveroo-btn-container">
    <a href="https://deliveroo.it/it/menu/ancona/senigallia/in-out?utm_campaign=organic&utm_medium=referrer&utm_source=menu_share" target="_blank" class="btn-deliveroo">
        <i class="fas fa-motorcycle"></i> Ordina su Deliveroo
    </a>
</div>

<a href="https://wa.me/393713813563?text=Ciao%21%20Vorrei%20prenotare%20un%20tavolo" target="_blank" class="whatsapp-float" aria-label="WhatsApp">
    <i class="fab fa-whatsapp"></i>
</a>

</body>
</html>
